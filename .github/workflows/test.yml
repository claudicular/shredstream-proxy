name: test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04-16c-64g-public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          caller-workflow-name: test

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Benchmark helper tests
        run: python3 -m unittest discover -s scripts -p test_bench.py -v

      - name: Benchmark runtime and forwarding smoke test
        run: |
          cargo build --locked -p jito-shredstream-proxy
          BENCH_PROXY_BIN="$PWD/target/debug/jito-shredstream-proxy" python3 -m unittest discover -s scripts -p test_bench_proxy.py -v
